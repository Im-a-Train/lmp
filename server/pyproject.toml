[project]
name = "lan-party-monitor-server"
version = "0.1.0"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "asyncpg",
  "aiosqlite",
  "python-dotenv",
  "pydantic",
  "pydantic-settings"
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan",
  "httpx",
  "pytest",
  "pytest-asyncio"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

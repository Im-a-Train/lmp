services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '8080:8080'
      - '8090:8090/udp'
    environment:
      DATABASE_URL: postgresql+asyncpg://lanmonitor:lanmonitor@db:5432/lanmonitor
      PUBLIC_BASE_URL: http://localhost:8080
      UDP_ECHO_PORT: '8090'
      METRICS_INTERVAL_SECONDS: '2'
      DOWNLOADS_DIR: /app/downloads
      WEB_DIST_DIR: /app/web-dist
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./downloads:/app/downloads
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lanmonitor
      POSTGRES_PASSWORD: lanmonitor
      POSTGRES_DB: lanmonitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanmonitor -d lanmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

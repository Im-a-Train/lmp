name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        working-directory: server
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run server tests
        working-directory: server
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Run web tests
        working-directory: web
        run: npm run test
      - name: Build web
        working-directory: web
        run: npm run build

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build client frontend
        working-directory: client
        run: npm run build
      - name: Run client Rust tests
        working-directory: client
        run: npm run test:rust
      - name: Build Linux client bundle
        working-directory: client
        run: npx tauri build --bundles appimage
      - name: Upload Linux client bundle
        uses: actions/upload-artifact@v4
        with:
          name: lanpulse-client-linux
          path: client/src-tauri/target/release/bundle/appimage/*

  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install client dependencies
        working-directory: client
        run: npm ci
      - name: Build Windows client bundle
        working-directory: client
        run: npx tauri build --bundles nsis
      - name: Upload Windows client bundle
        uses: actions/upload-artifact@v4
        with:
          name: lanpulse-client-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
